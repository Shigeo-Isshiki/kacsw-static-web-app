name: Azure Static Web Apps preview cleanup

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: List stale PR environments without deleting them
        required: true
        type: boolean
        default: true

concurrency:
  group: swa-preview-cleanup
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  pull-requests: read

jobs:
  cleanup:
    name: Clean up stale PR preview environments
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      SWA_NAME: kacsw-static-web-app
      SWA_RESOURCE_GROUP: static-web-apps
      SWA_PRODUCTION_BRANCH: main
      SWA_CLEANUP_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
    steps:
      - name: Check Azure OIDC configuration
        shell: bash
        run: |
          set -euo pipefail
          for variable in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::GitHub repository variable ${variable} is not configured."
              exit 1
            fi
          done

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Reconcile Azure environments with open pull requests
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: node scripts/cleanup-swa-preview-environments.js
